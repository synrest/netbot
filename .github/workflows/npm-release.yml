name: Stage npm release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact immutable release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    name: Validate and stage npm package
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
    steps:
      - name: Validate and resolve release tag
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if ! printf '%s\n' "$RELEASE_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "release_ref must be a semantic version tag" >&2
            exit 1
          fi
          release_sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$RELEASE_REF^{}" | awk 'NR == 1 {print $1}')
          if [ -z "$release_sha" ]; then
            release_sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" \
              "refs/tags/$RELEASE_REF" | awk 'NR == 1 {print $1}')
          fi
          test -n "$release_sha"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "requested release ref: $RELEASE_REF"
          echo "resolved release SHA: $release_sha"

      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: https://registry.npmjs.org

      - name: Use staged-publishing capable npm
        run: npm install --global npm@11.19.1

      - name: Verify release identity
        working-directory: npm/netbot
        env:
          EXPECTED_VERSION: ${{ env.RELEASE_REF }}
        run: |
          expected="${EXPECTED_VERSION#v}"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git describe --tags --exact-match "$RELEASE_SHA"
          package_version=$(node -p "require('./package.json').version")
          release_version=$(node -p "require('./release.json').version")
          test "$package_version" = "$expected"
          test "$release_version" = "$expected"
          test "$(node -p "require('./package.json').name")" = "@synrest/netbot"
          echo "checked-out git SHA: $(git rev-parse HEAD)"
          echo "package name: $(node -p "require('./package.json').name")"
          echo "package version: $package_version"
          echo "release.json version: $release_version"
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Run package tests
        working-directory: npm/netbot
        run: npm test

      - name: Run Netbot validation
        run: |
          python3 -m unittest discover -s tests -p 'test*.py' -q
          python3 -m compileall -q netbot tests

      - name: Pack and inspect npm artifact
        working-directory: npm/netbot
        run: |
          package_tgz=$(npm pack --json | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => process.stdout.write(JSON.parse(s)[0].filename))')
          test -n "$package_tgz"
          echo "PACKAGE_TGZ=$package_tgz" >> "$GITHUB_ENV"
          tar -tzf "$package_tgz" | grep -F 'package/package.json'
          tar -tzf "$package_tgz" | grep -F 'package/lib/postinstall.js'
          ! tar -tzf "$package_tgz" | grep -E '(^|/)(\.git|state|config|generated|\.npmrc)(/|$)'
          package_sha=$(sha256sum "$package_tgz" | awk '{print $1}')
          echo "PACKAGE_SHA256=$package_sha" >> "$GITHUB_ENV"
          echo "packed TGZ name: $package_tgz"
          echo "packed TGZ SHA-256: $package_sha"

      - name: Stage package for human approval
        working-directory: npm/netbot
        run: |
          echo "requested release ref: $RELEASE_REF"
          echo "resolved git SHA: $RELEASE_SHA"
          echo "checked-out git SHA: $(git rev-parse HEAD)"
          echo "package name: $(node -p "require('./package.json').name")"
          echo "package version: $(node -p "require('./package.json').version")"
          echo "release.json version: $(node -p "require('./release.json').version")"
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "packed TGZ name: $PACKAGE_TGZ"
          echo "packed TGZ SHA-256: $PACKAGE_SHA256"
          npm stage publish "./$PACKAGE_TGZ"
