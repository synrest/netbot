[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbot"
version = "0.4.5"
description = "Deterministic read-only network topology reconciler"
requires-python = ">=3.10"

[project.scripts]
netbot = "netbot.cli:main"
netbot-watch = "netbot.watcher:main"
